{% extends "base.html" %}
{% block title %}{{ "New Product" if product is none else "Edit Product" }} · FlashShop{% endblock %}
{% block content %}
<h2>{{ "New Product" if product is none else "Edit Product" }}</h2>

<div class="card shadow-sm" style="max-width: 760px;">
  <div class="card-body">
    <form
      method="post"
      action="{{ url_for('admin.admin_product_new') if product is none else url_for('admin.admin_product_edit', pid=product.id) }}"
    >
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" value="{{ product.name if product else '' }}" required />
      </div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Price ($)</label>
          <input type="number" step="0.01" min="0" name="price" class="form-control" value="{{ product.price if product else 0 }}" required />
        </div>
        <div class="col-md-4">
          <label class="form-label">Stock</label>
          <input type="number" step="1" min="0" name="stock" class="form-control" value="{{ product.stock if product else 0 }}" required />
        </div>
        <div class="col-md-4">
          <label class="form-label">Category</label>
          <input type="text" name="category" class="form-control" value="{{ product.category if product else 'General' }}" />
        </div>
      </div>
      <div class="mb-3 mt-3">
        <label class="form-label">Image URL (optional)</label>
        <input type="text" name="image_url" class="form-control" value="{{ product.image_url if product else '' }}" />
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="4">{{ product.description if product else '' }}</textarea>
      </div>
      <button class="btn btn-dark" type="submit">Save</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('admin.admin_products') }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
